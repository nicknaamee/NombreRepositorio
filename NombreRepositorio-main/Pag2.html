<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Video - Página 2</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            font-family: 'Comic Sans MS', 'Comic Sans', cursive !important;
        }
    </style>
</head>

<body>
    <header class="header">
        <h1 class="title">Título</h1>
    </header>

    <nav class="box p-0 mt-4 barra-navegacion">
        <div class="contenedor-menu">
            <a href="index.html" class="has-text-dark p-3 enlace-menu">Inicio</a>
            <a href="contacto.html" class="has-text-dark p-3 enlace-menu">Contacto</a>
            <a href="pag2.html" class="has-text-dark p-3 enlace-menu">Otra Pagina</a>
        </div>
    </nav>

    <main>
        <!-- texto del video jeje -->
        <div style="text-align: center; margin-top: 30px; margin-bottom: 20px;">
            <h2 class="title is-4">Mira esta otra pagina u.u</h2>
        </div>

        <!-- texto, video, artículo e imagen decorativa -->
        <section class="caja-contenido" style="max-width: 600px; margin: 0 auto 30px auto;">
            <p class="mb-4 has-text-centered">Reproduce el siguiente video sin salir de la pagina.</p>
            
            <figure class="image is-16by9 mb-5">
                <iframe 
                    class="has-ratio"
                    src="https://www.youtube.com/embed/ptWOsBkLj_E" 
                    title="Video de YouTube Shorts" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </figure>

            <article class="message is-dark mb-5">
                <div class="message-body">
                    <strong>Mira esta imagen</strong>  ahora tienes mas dopamina.
                </div>
            </article>

            <figure class="image">
                <img src="img/foca.jpeg" 
                    alt="Foca sonriente"
                    style="border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
            </figure>
        </section>
    </main>

    <footer class="footer has-text-centered">
        <p>Pie de página</p>
        <p class="mt-2">
            &copy; 2026 - Todos los derechos reservados | <strong>Subdirección del kizazo</strong>
        </p>
    </footer>

    <script src="js/main.js"></script>
</body>

</html>
